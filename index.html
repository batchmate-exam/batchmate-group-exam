<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172b67"><title>BatchMate Group Exam</title>
<style>
:root{--navy:#172b67;--blue:#3157d5;--bg:#f3f6fc;--ink:#172033;--muted:#667085;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}header{background:var(--navy);color:white;padding:22px 16px}header .wrap,main{max-width:960px;margin:auto}.brand{font-size:25px;font-weight:850}.brand small{display:block;font-size:12px;letter-spacing:2px;color:#d7e1ff}main{padding:18px 13px 45px}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}button{border:0;border-radius:10px;padding:11px 15px;background:var(--blue);color:white;font-weight:700;cursor:pointer}button.secondary{background:#e8edfb;color:#243b86}button.danger{background:#fff0ef;color:#b42318}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin:14px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px;margin:0 0 9px}.muted,.status{font-size:13px;color:var(--muted)}label{display:block;font-weight:650;font-size:14px;margin:8px 0 4px}input,textarea,select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;margin:4px 0 10px}textarea{min-height:70px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:10px;margin:9px 0}.option{display:flex;gap:9px;align-items:flex-start;padding:9px;border:1px solid var(--line);border-radius:9px;margin:7px 0}.option input{width:auto;margin:3px 0 0}.pill{border-radius:30px;background:#edf2ff;color:#2948a5;padding:5px 9px;font-size:12px}.hidden{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;padding:15px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><div class="wrap"><div class="brand">BatchMate <small>GROUP EXAM</small></div><p>Learn • Practice • Succeed</p></div></header><main>
<div class="tabs"><button id="tabStudent" onclick="showView('student')">শিক্ষার্থী</button><button id="tabAdmin" class="secondary" onclick="showView('admin')">অ্যাডমিন</button></div>
<section id="studentView">
<div class="card" id="studentLogin"><h2>পরীক্ষায় প্রবেশ</h2><p class="muted">তালিকাভুক্ত শিক্ষার্থীরা নাম ও রোল দিয়ে প্রবেশ করবে।</p><label>নাম</label><input id="studentName" placeholder="পূর্ণ নাম"><label>রোল নম্বর</label><input id="studentRoll" placeholder="যেমন: 01"><button onclick="studentContinue()">পরীক্ষা দেখো</button><div id="studentStatus" class="status"></div></div>
<div class="card hidden" id="examListCard"><div class="row between"><h2>প্রকাশিত পরীক্ষা</h2><span id="studentIdentity" class="pill"></span></div><div id="examList"></div></div>
<div class="card hidden" id="takeExamCard"><div class="row between"><h2 id="examHeading">পরীক্ষা</h2><span id="countdown" class="pill"></span></div><div id="examQuestions"></div><button onclick="submitAttempt()">উত্তর জমা দাও</button><div id="submitStatus" class="status"></div></div>
</section>
<section id="adminView">
<div class="card" id="adminLogin"><h2>অ্যাডমিন লগইন</h2><label>ইমেইল</label><input id="adminEmail" type="email"><label>পাসওয়ার্ড</label><input id="adminPassword" type="password"><button onclick="adminSignIn()">লগইন</button><div id="adminLoginStatus" class="status"></div></div>
<div id="adminPanel" class="hidden">
<div class="card"><div class="row between"><h2>Admin Dashboard</h2><button class="secondary" onclick="adminSignOut()">লগআউট</button></div></div>
<div class="card"><h2>শিক্ষার্থী যোগ করো</h2><label>নাম</label><input id="newStudentName"><label>রোল</label><input id="newStudentRoll"><button onclick="addStudent()">সংরক্ষণ</button><div id="studentAdminStatus" class="status"></div><h3 style="margin-top:15px">শিক্ষার্থী তালিকা</h3><div id="rosterList"></div></div>
<div class="card"><h2>নতুন MCQ পরীক্ষা</h2><label>পরীক্ষার নাম</label><input id="newExamTitle" placeholder="যেমন: বাংলা মডেল টেস্ট"><div class="grid"><div><label>সময় (মিনিট)</label><input id="newExamMinutes" type="number" min="1" value="20"></div><div><label>পূর্ণমান</label><input id="newExamMarks" type="number" min="1" value="10"></div></div><div id="questionBuilder"></div><div class="row"><button class="secondary" onclick="addQuestionForm()">+ প্রশ্ন যোগ</button><button onclick="saveExam()">পরীক্ষা সংরক্ষণ</button></div><div id="examAdminStatus" class="status"></div></div>
<div class="card"><h2>পরীক্ষার তালিকা</h2><div id="adminExamList"></div></div><div class="card"><h2>জমা দেওয়া উত্তর</h2><div id="attemptAdminList"></div></div>
</div></section><footer>BatchMate Group Exam</footer></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import{getFirestore,collection,doc,setDoc,getDocs,addDoc,query,where,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBmLq7jqicA2WSBd8UYkMr5-dVLJtMAhy8",authDomain:"batchmate-group-exam.firebaseapp.com",projectId:"batchmate-group-exam",storageBucket:"batchmate-group-exam.firebasestorage.app",messagingSenderId:"144154983299",appId:"1:144154983299:web:0dd99732355727bf90d4b6",measurementId:"G-DQ3QVV9M4E"};
const ADMIN_UID="VUDpdiEAeKbTTEVawKjzgZqp3582",app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
let student={},activeExam=null,selected={},timer=null,left=0,qnum=0;
const $=id=>document.getElementById(id),say=(id,s)=>$(id).textContent=s,rollId=r=>r.trim().replaceAll('/','_');
function admin(){if(!auth.currentUser||auth.currentUser.uid!==ADMIN_UID)throw Error("এই অ্যাকাউন্টটি অ্যাডমিন অ্যাকাউন্ট নয়।")}
window.showView=v=>{$('studentView').classList.toggle('hidden',v!=='student');$('adminView').classList.toggle('hidden',v!=='admin');$('tabStudent').className=v==='student'?'':'secondary';$('tabAdmin').className=v==='admin'?'':'secondary'};
window.adminSignIn=async()=>{say('adminLoginStatus','লগইন হচ্ছে…');try{let c=await signInWithEmailAndPassword(auth,$('adminEmail').value.trim(),$('adminPassword').value);if(c.user.uid!==ADMIN_UID){await signOut(auth);throw Error('এই ইমেইলটি নির্ধারিত অ্যাডমিন UID নয়।')} $('adminLogin').classList.add('hidden');$('adminPanel').classList.remove('hidden');loadAdmin()}catch(e){say('adminLoginStatus','লগইন হয়নি: '+e.message)}};
window.adminSignOut=async()=>{await signOut(auth);$('adminPanel').classList.add('hidden');$('adminLogin').classList.remove('hidden')};
window.studentContinue=async()=>{let n=$('studentName').value.trim(),r=$('studentRoll').value.trim();if(!n||!r){say('studentStatus','নাম ও রোল লিখো।');return}student={name:n,roll:r};try{if(!auth.currentUser||auth.currentUser.uid===ADMIN_UID)await signInAnonymously(auth);$('studentIdentity').textContent=n+' • রোল '+r;$('studentLogin').classList.add('hidden');$('examListCard').classList.remove('hidden');await loadPublished()}catch(e){say('studentStatus','প্রবেশ করা যায়নি: '+e.message)}};
async function loadPublished(){let s=await getDocs(query(collection(db,'exams'),where('published','==',true))),el=$('examList');el.innerHTML='';if(s.empty){el.textContent='এখনো পরীক্ষা প্রকাশ করা হয়নি।';return}s.forEach(d=>{let x=d.data(),box=document.createElement('div');box.className='item';let b=document.createElement('button');b.textContent='পরীক্ষা শুরু';b.onclick=()=>beginExam(d.id,x);box.innerHTML=`<b>${escapeHtml(x.title)}</b><p class="muted">${x.questions.length}টি প্রশ্ন • ${x.minutes} মিনিট</p>`;box.append(b);el.append(box)})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function beginExam(id,x){activeExam={id,...x};selected={};$('examListCard').classList.add('hidden');$('takeExamCard').classList.remove('hidden');$('examHeading').textContent=x.title;let el=$('examQuestions');el.innerHTML='';x.questions.forEach((q,i)=>{let box=document.createElement('div');box.className='item';let h=document.createElement('b');h.textContent=(i+1)+'. '+q.text;box.append(h);q.options.forEach((o,j)=>{let l=document.createElement('label');l.className='option';let inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.onchange=()=>selected[i]=j;let sp=document.createElement('span');sp.textContent=o;l.append(inp,sp);box.append(l)});el.append(box)});left=x.minutes*60;tick();clearInterval(timer);timer=setInterval(()=>{left--;tick();if(left<=0)submitAttempt(true)},1000)}
function tick(){$('countdown').textContent='সময় '+Math.floor(left/60)+':'+String(left%60).padStart(2,'0')}
window.submitAttempt=async(auto=false)=>{if(!activeExam)return;if(!auto&&!confirm('উত্তর জমা দিতে চাও?'))return;clearInterval(timer);say('submitStatus','উত্তর জমা হচ্ছে…');try{await addDoc(collection(db,'attempts'),{uid:auth.currentUser.uid,name:student.name,roll:student.roll,examId:activeExam.id,examTitle:activeExam.title,answers:selected,submittedAt:serverTimestamp(),status:'submitted'});$('takeExamCard').classList.add('hidden');$('examListCard').classList.remove('hidden');alert('উত্তর জমা হয়েছে। ফলাফল শিক্ষক পর্যালোচনা করে প্রকাশ করবেন।');await loadPublished()}catch(e){say('submitStatus','জমা হয়নি: '+e.message);}};
window.addQuestionForm=()=>{let idx=++qnum,w=document.createElement('div');w.className='item qform';w.innerHTML=`<h3>প্রশ্ন ${idx}</h3><label>প্রশ্ন</label><textarea class="qt"></textarea><div class="grid"><div><label>অপশন ক</label><input class="op"></div><div><label>অপশন খ</label><input class="op"></div><div><label>অপশন গ</label><input class="op"></div><div><label>অপশন ঘ</label><input class="op"></div></div><label>সঠিক উত্তর (অ্যাডমিন)</label><select class="ans"><option value="0">ক</option><option value="1">খ</option><option value="2">গ</option><option value="3">ঘ</option></select><button class="danger">বাদ দাও</button>`;w.querySelector('button').onclick=()=>w.remove();$('questionBuilder').append(w)};
window.saveExam=async()=>{try{admin();let title=$('newExamTitle').value.trim(),minutes=Number($('newExamMinutes').value),marks=Number($('newExamMarks').value),forms=[...document.querySelectorAll('.qform')];if(!title||minutes<1||!forms.length)throw Error('পরীক্ষার নাম, সময় ও প্রশ্ন দিন।');let questions=[],keys=[];for(let f of forms){let text=f.querySelector('.qt').value.trim(),options=[...f.querySelectorAll('.op')].map(x=>x.value.trim()),a=Number(f.querySelector('.ans').value);if(!text||options.some(x=>!x))throw Error('সব প্রশ্ন ও চারটি অপশন পূরণ করুন।');questions.push({text,options});keys.push(a)}let ref=doc(collection(db,'exams'));await setDoc(ref,{title,minutes,marks,questions,published:false,createdAt:serverTimestamp()});await setDoc(doc(db,'answerKeys',ref.id),{answers:keys});say('examAdminStatus','পরীক্ষা সংরক্ষিত হয়েছে। এখন তালিকা থেকে প্রকাশ করতে পারো।');$('newExamTitle').value='';$('questionBuilder').innerHTML='';qnum=0;addQuestionForm();loadAdmin()}catch(e){say('examAdminStatus','সংরক্ষণ হয়নি: '+e.message)}};
window.addStudent=async()=>{try{admin();let name=$('newStudentName').value.trim(),roll=$('newStudentRoll').value.trim();if(!name||!roll||roll.includes('/'))throw Error('নাম ও রোল দিন (রোলে / ব্যবহার করবেন না)।');await setDoc(doc(db,'students',rollId(roll)),{name,roll,active:true,createdAt:serverTimestamp()});$('newStudentName').value='';$('newStudentRoll').value='';say('studentAdminStatus','শিক্ষার্থী যোগ হয়েছে।');loadAdmin()}catch(e){say('studentAdminStatus','সংরক্ষণ হয়নি: '+e.message)}};
async function loadAdmin(){try{admin();let[ss,es,as]=await Promise.all([getDocs(collection(db,'students')),getDocs(collection(db,'exams')),getDocs(collection(db,'attempts'))]);$('rosterList').innerHTML='';ss.forEach(s=>{let d=document.createElement('div');d.className='item';d.textContent=s.data().name+' — রোল '+s.data().roll;$('rosterList').append(d)});$('adminExamList').innerHTML='';es.forEach(s=>{let x=s.data(),d=document.createElement('div');d.className='item';let t=document.createElement('b');t.textContent=x.title;let p=document.createElement('p');p.className='muted';p.textContent=x.published?'প্রকাশিত':'অপ্রকাশিত';let b=document.createElement('button');b.textContent=x.published?'অপ্রকাশিত করো':'প্রকাশ করো';b.onclick=async()=>{await setDoc(doc(db,'exams',s.id),{published:!x.published},{merge:true});loadAdmin()};d.append(t,p,b);$('adminExamList').append(d)});$('attemptAdminList').innerHTML='';as.forEach(s=>{let a=s.data(),d=document.createElement('div');d.className='item';d.textContent=`${a.name} | রোল ${a.roll} | ${a.examTitle} | জমা হয়েছে`;$('attemptAdminList').append(d)})}catch(e){console.error(e)}}
addQuestionForm();
</script></body></html>
